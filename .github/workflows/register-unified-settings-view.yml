name: Google 전용 설정 화면 Xcode 등록

on:
  push:
    branches:
      - feature/testflight-signing-config
    paths:
      - ".github/workflows/register-unified-settings-view.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: register-unified-settings-view
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Xcode 프로젝트 등록
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          project = Path("CameraAccess.xcodeproj/project.pbxproj")
          text = project.read_text(encoding="utf-8")

          if "UnifiedSettingsView.swift in Sources" not in text:
              build_anchor = "\t\t4BA57AE72EF8227E002EC214 /* SettingsView.swift in Sources */ = {isa = PBXBuildFile; fileRef = 4BA57AB92EF8227E002EC214 /* SettingsView.swift */; };\n"
              file_anchor = "\t\t4BA57AB92EF8227E002EC214 /* SettingsView.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = SettingsView.swift; sourceTree = \"<group>\"; };\n"
              group_anchor = "\t\t\t\t4BA57AB92EF8227E002EC214 /* SettingsView.swift */,\n"
              source_anchor = "\t\t\t\t4BA57AE72EF8227E002EC214 /* SettingsView.swift in Sources */,\n"

              for anchor in (build_anchor, file_anchor, group_anchor, source_anchor):
                  if anchor not in text:
                      raise SystemExit("UnifiedSettingsView 등록 기준 문자열을 찾지 못했습니다")

              text = text.replace(
                  build_anchor,
                  build_anchor + "\t\tB27C3D4E5F60718293A4B5C6 /* UnifiedSettingsView.swift in Sources */ = {isa = PBXBuildFile; fileRef = B27C3D4E5F60718293A4B5C7 /* UnifiedSettingsView.swift */; };\n",
                  1,
              )
              text = text.replace(
                  file_anchor,
                  file_anchor + "\t\tB27C3D4E5F60718293A4B5C7 /* UnifiedSettingsView.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = UnifiedSettingsView.swift; sourceTree = \"<group>\"; };\n",
                  1,
              )
              text = text.replace(
                  group_anchor,
                  group_anchor + "\t\t\t\tB27C3D4E5F60718293A4B5C7 /* UnifiedSettingsView.swift */,\n",
                  1,
              )
              text = text.replace(
                  source_anchor,
                  source_anchor + "\t\t\t\tB27C3D4E5F60718293A4B5C6 /* UnifiedSettingsView.swift in Sources */,\n",
                  1,
              )
              project.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/register-unified-settings-view.yml")
          workflow.unlink()
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Register UnifiedSettingsView in Xcode project"
          git push origin "HEAD:${GITHUB_REF_NAME}"
