name: Gemini Live 공용 세션 확장

on:
  push:
    branches:
      - feature/testflight-signing-config
    paths:
      - ".github/workflows/extend-gemini-live-service.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extend-gemini-live-service
  cancel-in-progress: false

jobs:
  extend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gemini Live 서비스 확장
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("CameraAccess/Services/GeminiLiveService.swift")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f"GeminiLiveService 기준 문자열을 찾지 못했습니다: {old[:80]}")
              text = text.replace(old, new, 1)

          replace_once(
              "    private let apiKey: String\n    private let model: String\n",
              "    private let apiKey: String\n"
              "    private let model: String\n"
              "    private let systemInstruction: String\n"
              "    private let voiceName: String\n"
              "    private let audioOutputEnabled: Bool\n",
          )

          replace_once(
              "    init(apiKey: String, model: String? = nil) {\n"
              "        self.apiKey = apiKey\n"
              "        self.model = model ?? \"gemini-3.1-flash-live-preview\"\n"
              "        super.init()\n"
              "        setupAudioEngines()\n"
              "    }\n",
              "    init(\n"
              "        apiKey: String,\n"
              "        model: String? = nil,\n"
              "        systemInstruction: String? = nil,\n"
              "        voiceName: String = \"Aoede\",\n"
              "        audioOutputEnabled: Bool = true\n"
              "    ) {\n"
              "        self.apiKey = apiKey\n"
              "        self.model = model ?? GeminiModelCatalog.live\n"
              "        self.systemInstruction = systemInstruction ?? LiveAIModeManager.staticSystemPrompt\n"
              "        self.voiceName = voiceName\n"
              "        self.audioOutputEnabled = audioOutputEnabled\n"
              "        super.init()\n"
              "        setupAudioEngines()\n"
              "    }\n",
          )

          audio_pattern = re.compile(
              r"    private func configureAudioSession\(\) throws \{.*?\n    \}\n\n    @discardableResult",
              re.DOTALL,
          )
          audio_replacement = '''    private func configureAudioSession(usePhoneMic: Bool? = nil) throws {
        let session = AVAudioSession.sharedInstance()
        var options: AVAudioSession.CategoryOptions = [.defaultToSpeaker]

        if usePhoneMic != true {
            options.insert(.allowBluetooth)
            options.insert(.allowBluetoothA2DP)
        }

        try session.setCategory(.playAndRecord, mode: .voiceChat, options: options)
        try session.setActive(true, options: [.notifyOthersOnDeactivation])

        if usePhoneMic == true,
           let builtInMic = session.availableInputs?.first(where: { $0.portType == .builtInMic }) {
            try session.setPreferredInput(builtInMic)
        } else if usePhoneMic == false,
                  let bluetoothInput = session.availableInputs?.first(where: {
                      $0.portType == .bluetoothHFP || $0.portType == .bluetoothLE
                  }) {
            try session.setPreferredInput(bluetoothInput)
        }

        let inputs = session.currentRoute.inputs
            .map { "\\($0.portType.rawValue):\\($0.portName)" }
            .joined(separator: ",")
        let outputs = session.currentRoute.outputs
            .map { "\\($0.portType.rawValue):\\($0.portName)" }
            .joined(separator: ",")
        let inputPreference = usePhoneMic.map { $0 ? "iphone" : "bluetooth" } ?? "automatic"
        print(
            "[Gemini][AUDIO] 세션 활성 input=[\\(inputs)] output=[\\(outputs)] "
            + "sampleRate=\\(session.sampleRate) inputPreference=\\(inputPreference)"
        )
    }

    @discardableResult'''
          text, count = audio_pattern.subn(audio_replacement, text, count=1)
          if count != 1:
              raise SystemExit("configureAudioSession 교체 실패")

          replace_once(
              "        let instructions = LiveAIModeManager.staticSystemPrompt\n",
              "        let instructions = systemInstruction\n",
          )
          replace_once(
              "                            \"voiceName\": \"Aoede\"\n",
              "                            \"voiceName\": voiceName\n",
          )
          replace_once(
              "        print(\"[Gemini][INFO] 한국어 세션 설정 전송 model=\\(model) voice=Aoede instructionLength=\\(instructions.count)\")\n",
              "        print(\"[Gemini][INFO] 세션 설정 전송 model=\\(model) voice=\\(voiceName) instructionLength=\\(instructions.count) audio=\\(audioOutputEnabled)\")\n",
          )

          replace_once(
              "    func startRecording() {\n",
              "    func startRecording(usePhoneMic: Bool? = nil) {\n",
          )
          replace_once(
              "                        self?.startRecording()\n",
              "                        self?.startRecording(usePhoneMic: usePhoneMic)\n",
          )
          replace_once(
              "            if audioEngine == nil {\n                audioEngine = AVAudioEngine()\n            }\n\n            try configureAudioSession()\n",
              "            if audioEngine == nil {\n                audioEngine = AVAudioEngine()\n            }\n\n            try configureAudioSession(usePhoneMic: usePhoneMic)\n",
          )

          replace_once(
              "                    onAudioDelta?(audioData)\n                    handleAudioDelta(audioData)\n",
              "                    onAudioDelta?(audioData)\n                    if audioOutputEnabled {\n                        handleAudioDelta(audioData)\n                    }\n",
          )

          text = text.replace(" userInfo=\\(nsError.userInfo)", "")
          text = text.replace(" model=\\(model) apiKeyConfigured=true", " model=\\(model)")
          text = text.replace(
              "        // The API key is deliberately omitted. The raw Gemini Live API requires it\n"
              "        // in the WebSocket query string, which is exactly where humans historically\n"
              "        // decided secrets should live.\n",
              "        // 인증값이 필요한 URL 전체는 어떤 로그에도 기록하지 않는다.\n",
          )

          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/extend-gemini-live-service.yml").unlink()
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make Gemini Live reusable for translation sessions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
