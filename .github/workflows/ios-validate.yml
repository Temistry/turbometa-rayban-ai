name: iOS 빌드 검증

on:
  push:
    branches:
      - feature/testflight-signing-config
  pull_request:
    paths:
      - "CameraAccess/**"
      - "CameraAccess.xcodeproj/**"
      - "Package.resolved"
      - ".github/workflows/ios-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iPhone 시뮬레이터 빌드
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: 최신 안정 Xcode 선택
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode 및 프로젝트 정보
        run: |
          xcodebuild -version
          xcodebuild -list -project CameraAccess.xcodeproj

      - name: Swift 패키지 의존성 확인
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project CameraAccess.xcodeproj

      - name: iOS 시뮬레이터 빌드
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build 2>&1 | tee xcodebuild.log

      - name: 빌드 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
