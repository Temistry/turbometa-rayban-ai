name: 한국어 리소스 디렉터리 정리

on:
  push:
    branches:
      - feature/testflight-signing-config
    paths:
      - ".github/workflows/migrate-korean-locale.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: migrate-korean-locale
  cancel-in-progress: false

jobs:
  migrate:
    name: zh-Hans 리소스를 ko 리소스로 이전
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 한국어 리소스와 Xcode 프로젝트 정리
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f CameraAccess/ko.lproj/Localizable.strings ]]; then
            echo "ko.lproj가 이미 존재합니다. 추가 변경 없이 종료합니다."
            exit 0
          fi

          test -f CameraAccess/zh-Hans.lproj/Localizable.strings
          git mv CameraAccess/zh-Hans.lproj CameraAccess/ko.lproj

          python3 - <<'PY'
          from pathlib import Path

          project = Path("CameraAccess.xcodeproj/project.pbxproj")
          text = project.read_text(encoding="utf-8")
          text = text.replace("zh-Hans", "ko")
          text = text.replace("developmentRegion = en;", "developmentRegion = ko;")
          project.write_text(text, encoding="utf-8")

          language = Path("CameraAccess/Managers/LanguageManager.swift")
          text = language.read_text(encoding="utf-8")
          text = text.replace(
              "// 기존 프로젝트의 zh-Hans 리소스 파일을 한국어 리소스 컨테이너로 재사용한다.",
              "// 앱에 포함된 한국어 리소스 번들을 사용한다.",
          )
          text = text.replace('path(forResource: "zh-Hans", ofType: "lproj")', 'path(forResource: "ko", ofType: "lproj")')
          language.write_text(text, encoding="utf-8")

          audit = Path("Scripts/audit_localization_security.py")
          text = audit.read_text(encoding="utf-8")
          text = text.replace(
              'SUPPORTED_KOREAN_RESOURCE_DIRECTORIES = {"ko.lproj", "zh-Hans.lproj"}',
              'SUPPORTED_KOREAN_RESOURCE_DIRECTORIES = {"ko.lproj"}',
          )
          audit.write_text(text, encoding="utf-8")
          PY

          rm .github/workflows/migrate-korean-locale.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move Korean localization resources to ko.lproj"
          git push origin "HEAD:${GITHUB_REF_NAME}"
